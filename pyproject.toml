[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "sc-load"
version = "0.2.0"
description = "Compile ordered single-cell row requests into reusable prefetch plans over sc-compress matrices"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.16"
dependencies = [
    "numpy>=2.2.6",
    "sc-compress",
    "anndata>=0.11",
    "zarr>=3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.8,<2",
    "pytest>=8.0",
    "ruff>=0.12",
    "scipy>=1.13",
    "pandas>=2",
]

[tool.uv.sources]
sc-compress = { path = "crates/sc-compress/python", editable = true }

[tool.maturin]
bindings = "pyo3"
features = ["extension-module"]
manifest-path = "crates/sc-load/python/Cargo.toml"
module-name = "sc_load._core"
python-source = "src"

[tool.pytest.ini_options]
testpaths = [
    "crates/sc-load/python/tests",
    "crates/sc-compress/python/tests",
]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
