[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "scdata-toolkit"
version = "0.2.0"
description = "Compress, AnnData, and prefetch loading for single-cell matrices"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9,<3.16"
dependencies = [
    "numpy>=2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.optional-dependencies]
scipy = ["scipy>=1.13"]
anndata = ["anndata>=0.10", "zarr>=2.16"]
dev = [
    "maturin>=1.8,<2",
    "pytest>=8.0",
    "pyright>=1.1.410",
    "ruff>=0.12",
    "scipy>=1.13",
    "pandas>=2",
    "anndata>=0.10",
    "zarr>=2.16",
]

[tool.maturin]
bindings = "pyo3"
features = ["extension-module"]
manifest-path = "crates/scdata-python/Cargo.toml"
module-name = "scdata._core"
python-source = "src"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pyright]
include = ["src/scdata", "scripts/convert_zarrzip_to_scczip.py"]
pythonVersion = "3.9"
typeCheckingMode = "standard"
