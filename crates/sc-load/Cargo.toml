[package]
name = "sc-load"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Statically compiled single-cell prefetch execution"
readme = "README.md"
publish.workspace = true

[features]
default = ["uring"]
profile = []
uring = ["dep:io-uring"]

[dependencies]
dyn-blosc = { path = "../dyn-blosc" }
sc-compress = { path = "../sc-compress" }
io-uring = { version = "0.7", optional = true }
parking_lot = "0.12"
rustix = { version = "1", features = ["fs", "mm", "param", "process", "thread"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
